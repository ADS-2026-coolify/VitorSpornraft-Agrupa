spring.application.name=tat-3ds

# Banco de dados
# Sem variaveis de ambiente usa HSQLDB em memoria (desenvolvimento local).
# Em producao (Coolify) defina DB_URL, DB_USERNAME e DB_PASSWORD apontando para o PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:hsqldb:mem:testdb}
spring.datasource.username=${DB_USERNAME:SA}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

server.port=${PORT:8080}
server.forward-headers-strategy=framework
